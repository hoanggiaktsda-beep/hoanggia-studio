name: Studio browser regression
on:
  push:
    branches: ["feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/hg-server.log 2>&1 &
          npx playwright test tests/studio.spec.mjs --config=playwright.config.mjs --reporter=list
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-artifacts
          path: test-results/
