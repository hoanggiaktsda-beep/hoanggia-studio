name: Deploy Studio Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate core behavior and JavaScript syntax (report failures without blocking Pages)
        continue-on-error: true
        run: node --test tests/core.test.mjs tests/prompt-library.test.mjs && node --check src/prompts-category-05.js && node --check src/prompts-category-06.js && node --check src/prompts-category-07.js && node --check src/prompts-category-05-adapter.js && node --check src/app.js && node --check src/core.js && node --check src/design-brain.js && node --check src/intelligence-core.js && node --check design-ai/app.mjs && node --check design-ai/core.mjs && node --check design-ai/design-catalog.mjs && node --check design-ai/image-advisor.mjs
      - name: Verify published kit exists in source
        run: test -s video-prompt-kit.html && grep -q "HOANGGIA Video Prompt Kit" src/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
